buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'com.google.gms:google-services:4.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->

        // Force Java toolchain to 17 everywhere
        if (project.plugins.hasPlugin("java") ||
                project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {

            project.extensions.configure(com.android.build.gradle.BaseExtension) { ext ->
                ext.compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }

                // Some older plugins (e.g. qr_code_scanner) don't declare a namespace,
                // which newer AGP requires. Backfill it from the manifest's package attr.
                if (ext.namespace == null) {
                    def manifest = new File(project.projectDir, 'src/main/AndroidManifest.xml')
                    if (manifest.exists()) {
                        def pkg = new XmlSlurper().parse(manifest).@package.text()
                        if (pkg != null && !pkg.isEmpty()) {
                            ext.namespace = pkg
                        }
                    }
                }
            }
        }

        // Force Kotlin to use JVM 17
        if (project.plugins.hasPlugin("kotlin-android") ||
                project.plugins.hasPlugin("org.jetbrains.kotlin.android") ||
                project.plugins.hasPlugin("kotlin")) {

            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                task.kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}


subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
